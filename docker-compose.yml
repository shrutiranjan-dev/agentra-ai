version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: personal-assistant-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db

  neo4j:
    image: neo4j:5
    container_name: personal-assistant-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password12345
    volumes:
      - ./neo4j-data:/data
      - ./neo4j-logs:/logs
